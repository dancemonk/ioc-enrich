[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ioc-enrich"
version = "0.1.0"
description = "Look up IOCs in public threat-intel APIs and write the results to a CSV (lookup only)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ioc-enrich = "ioc_enrich.cli:main"

[tool.setuptools]
packages = ["ioc_enrich", "ioc_enrich.sources"]

[tool.setuptools.package-data]
ioc_enrich = ["data/*", "web/*"]
